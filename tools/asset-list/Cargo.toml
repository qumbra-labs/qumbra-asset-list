[package]
name = "asset-list"
version = "0.1.0"
edition = "2021"
publish = false
description = "Keygen, sign and verify for the Qumbra asset list (ML-DSA-65)."

[dependencies]
# The verifier is the wallet's own (one parser, one domain string): the list
# this tool signs is accepted by exactly the code every wallet runs.
# Pinned to lab main 9f5f26cd, which carries AD2 (lab PR #865, merged).
qumbra-wallet = { git = "https://github.com/qumbra-labs/qumbra-lab", rev = "9f5f26cd", default-features = false, features = ["verify"] }
# The exact ml-dsa rev the lab pins.
ml-dsa = "=0.1.1"
getrandom = "0.3"

[workspace]
